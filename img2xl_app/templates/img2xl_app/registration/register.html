{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng ký tài khoản</title>
	<link rel="stylesheet" href="{% static 'css/registration/register.css' %}">
	<link rel="stylesheet"
		  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<div class="register-wrapper">
	<div class="register-card">
		<div class="register-header">
			<h2>Tạo tài khoản</h2>
			<p>Vui lòng hoàn thành các bước để đăng ký</p>
		</div>
		
		<form method="post" id="registerForm" novalidate>
			{% csrf_token %}
			
			<div class="form-content">
				{{ form.as_p }}
				
				<div id="password-error" class="error-msg small-msg"></div>
				
				<div id="email-feedback-container">
					<div id="email-error" class="error-msg small-msg"></div>
					<div id="email-success" class="success-msg small-msg" style="display:none;">
						<i class="fa fa-check-circle"></i> Email khả dụng!
					</div>
				</div>
				
				<div id="otp-section" class="otp-container" style="display: none;">
					<label>Xác thực mã OTP</label>
					<div class="otp-input-group">
						<input type="text" id="otp_code_input" placeholder="4 số" maxlength="4"
								autocomplete="off">
						<button type="button" id="actionOtpBtn" class="secondary-btn">Gửi mã
						</button>
					</div>
					
					<div class="otp-footer">
						<div id="otp-status-msg" class="small-msg"></div>
						<span id="resend-text" style="display:none;">
							Không nhận được mã? <a href="javascript:void(0)" id="resend-link">Gửi lại mã</a> <span
							id="timer"></span>
						</span>
					</div>
				</div>
			</div>
			
			<div class="submit-wrapper">
				<button type="submit" id="submitBtn" disabled>
					<span class="btn-text">Đăng ký</span>
					<div class="loader" id="loader"></div>
				</button>
				
				<div id="submit-tooltip" class="tooltip-box">
					<p class="tooltip-title">Cần hoàn thành:</p>
					<ul>
						<li id="req-pw" class="req-item invalid">Mật khẩu phải khớp</li>
						<li id="req-email" class="req-item invalid">Email chưa đăng ký</li>
						<li id="req-otp" class="req-item invalid">Chưa xác thực mã OTP</li>
					</ul>
				</div>
			</div>
		</form>
		
		<div class="register-footer">
			<p>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
		</div>
	</div>
</div>

<script src="{% static 'js/registration/register.js' %}"></script>
</body>
</html>
