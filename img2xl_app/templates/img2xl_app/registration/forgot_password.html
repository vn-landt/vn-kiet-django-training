{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="csrf-token" content="{{ csrf_token }}">
	<title>Quên mật khẩu</title>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<link rel="stylesheet" href="{% static 'img2xl_app/css/registration/register.css' %}">
	<link rel="stylesheet"
		  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
	<div class="register-wrapper">
		<div class="register-card">
			<div class="register-header">
				<h2>Khôi phục mật khẩu</h2>
				<p>Nhập Gmail đã đăng ký để nhận mã xác thực</p>
			</div>
			
			<form id="forgotForm" autocomplete="off">
				{% csrf_token %}
				<div class="form-content">
					<p>
						<label>Email của bạn</label>
						<input type="email" id="id_email" placeholder="example@gmail.com" autocomplete="off" required>
					</p>
					
					<div id="email-feedback-container">
						<div id="email-error" class="error-msg small-msg"></div>
					</div>
					
					<div id="otp-section" class="otp-container" style="display: none;">
						<label>Xác thực mã OTP</label>
						<div class="otp-input-group">
							<input type="text" id="otp_code_input" placeholder="4 số" maxlength="4"
								   autocomplete="off">
							<button type="button" id="actionOtpBtn" class="secondary-btn">Gửi mã
							</button>
						</div>
						
						<div class="otp-footer">
							<div id="otp-status-msg" class="small-msg"></div>
							<span id="resend-text" style="display:none;">
								Không nhận được mã? <a href="javascript:void(0)" id="resend-link">Gửi lại mã</a> <span
								id="timer"></span>
							</span>
						</div>
					</div>
					
					<div id="password-reset-section"
						 style="display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
						<p>
							<label>Mật khẩu mới</label>
							<input type="password" id="new_password" placeholder="Nhập mật khẩu mới">
						</p>
						<p>
							<label>Xác nhận mật khẩu mới</label>
							<input type="password" id="confirm_new_password"
								placeholder="Nhập lại mật khẩu mới">
						</p>
						<div id="pass-match-error" class="error-msg small-msg"></div>
					</div>
				</div>
				
				<div class="submit-wrapper">
					<button type="button" id="submitBtn" disabled>
						<span class="btn-text">Đặt lại mật khẩu</span>
						<div class="loader"></div>
					</button>
					
					<div id="submit-tooltip" class="tooltip-box">
						<p class="tooltip-title">Cần hoàn thành:</p>
						<ul>
							<li id="req-email" class="req-item invalid">Email phải tồn tại</li>
							<li id="req-otp" class="req-item invalid">Chưa xác thực OTP</li>
							<li id="req-pw" class="req-item invalid">Mật khẩu phải trùng khớp</li>
						</ul>
					</div>
				</div>
			</form>
			
			<div class="register-footer">
				<p>Quay lại <a href="{% url 'login' %}">Đăng nhập</a></p>
			</div>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="{% static 'img2xl_app/js/common/utils.js' %}"></script>
	<script src="{% static 'img2xl_app/js/services/registration/auth_service.js' %}"></script>
	<script src="{% static 'img2xl_app/js/components/registration/forgot_password.js' %}"></script>
	<script src="{% static 'img2xl_app/js/components/registration/forgot_password_manager.js' %}"></script>
</body>
</html>
