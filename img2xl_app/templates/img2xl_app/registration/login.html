{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng nhập hệ thống</title>
	<link rel="stylesheet" href="{% static 'img2xl_app/css/registration/login.css' %}">
</head>
<body>
	<div class="login-wrapper">
		<div class="login-card">
			<div class="login-header">
				<h2>Chào mừng trở lại</h2>
				<p>Vui lòng nhập thông tin để tiếp tục</p>
			</div>
			
			<form method="post" id="loginForm">
				{% csrf_token %}
				
				<div class="form-content">
					{{ form.as_p }}
				</div>
				
				<button type="submit" id="submitBtn">
					<span class="btn-text">Đăng nhập</span>
					<div class="loader" id="loader"></div>
				</button>
			</form>
			
			<div class="login-footer">
				<p>Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay</a></p>
				<p>Quên mật khẩu? <a href="{% url 'forgot_password' %}">Khôi phục tài khoản</a></p>
			</div>
		</div>
	</div>
	<script src="{% static 'img2xl_app/js/common/utils.js' %}"></script>
	<script src="{% static 'img2xl_app/js/components/registration/login.js' %}"></script>
</body>
</html>
