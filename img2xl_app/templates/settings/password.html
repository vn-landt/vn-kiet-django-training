<div class="settings-section">
    <h5 class="mb-2">Change password</h5>
    <p class="text-muted small mb-4">Để bảo mật, vui lòng nhập mật khẩu cũ trước khi đặt mật khẩu mới.</p>

    <form method="POST" action="{% url 'change_password' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Mật khẩu cũ</label>
            <input type="password" name="old_password" class="form-control" required placeholder="Nhập mật khẩu hiện tại">
        </div>

        <hr>

        <div class="form-group">
            <label>Mật khẩu mới</label>
            <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="Tối thiểu 6 ký tự">
        </div>

        <div class="form-group">
            <label>Xác nhận mật khẩu mới</label>
            <input type="password" name="confirm_password" class="form-control" required placeholder="Nhập lại mật khẩu mới">
        </div>

        <button type="submit" class="btn btn-primary px-4 shadow-sm">Save changes</button>
    </form>
</div>
